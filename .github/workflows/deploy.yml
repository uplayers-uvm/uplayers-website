# Publishes the site to Cloudflare Pages every time something is saved (from Pages CMS or a code push).
# Needs one repository secret: CLOUDFLARE_API_TOKEN (Settings → Secrets and variables → Actions).
name: Publish website

on:
  push:
    branches: [ main ]
  schedule:
    - cron: "0 9 * * *" # daily rebuild (~4-5am Vermont time) so finished events drop off "Upcoming"
  workflow_dispatch: {}

concurrency:
  group: publish
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_ACCOUNT_ID: 572c5737ce1f36103d5f06d2c7f40243
      CLOUDFLARE_PROJECT: uplayers
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Publish to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "::warning::CLOUDFLARE_API_TOKEN secret is not set yet; skipping publish."; exit 0; fi
          npx -y wrangler@4 pages deploy dist --project-name "$CLOUDFLARE_PROJECT" --branch main --commit-hash "$GITHUB_SHA" --commit-message "$(git log -1 --pretty=%s | head -c 300)"
      - name: Build UVM-branded version
        run: PUBLIC_THEME=uvm npm run build
      - name: Publish UVM-branded version (unlisted preview at uvm.uplayers.pages.dev)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then exit 0; fi
          npx -y wrangler@4 pages deploy dist --project-name "$CLOUDFLARE_PROJECT" --branch uvm --commit-hash "$GITHUB_SHA" --commit-message "UVM theme: $(git log -1 --pretty=%s | head -c 280)"
